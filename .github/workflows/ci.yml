name: CI

on:
  push:
    branches-ignore: [bot-state]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          actionlint
      - name: Test (coverage >= 85% on gembot/)
        run: python -m pytest --cov=gembot --cov-report=term-missing --cov-fail-under=85
      - name: Offline replay of a recorded day
        run: python -m gembot replay tests/fixtures/scenario_day/ --check
