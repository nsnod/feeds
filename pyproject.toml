[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gembot"
version = "0.1.0"
description = "Discord bot that finds upcoming small indie / friendslop co-op games before everyone else"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "feedparser>=6.0,<7",
  "rapidfuzz>=3.6,<4",
  "pyyaml>=6.0,<7",
  "selectolax>=0.3",
  "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
gembot = "gembot.__main__:main"

[tool.setuptools.packages.find]
include = ["gembot*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["state", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001",  # ambiguous unicode in strings (we use emoji and ▰ on purpose)
  "RUF002",
  "RUF003",
  "RUF012",  # mutable class defaults are fine on pydantic models
  "SIM108",
  "E501",    # the formatter owns line length; long strings/URLs are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gembot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
